<style>
  /* 
   Automated Meal Planning Assistant - Premium CSS Style Sheet
   Includes modern dark mode, glassmorphism, responsive grids, and clean transitions.
*/

  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

  :root {
    --bg-primary: #1c1e15;
    /* Deep organic olive-black */
    --bg-secondary: #272a1e;
    /* Dark forest green */
    --bg-card: rgba(39, 42, 30, 0.75);
    /* Muted dark green glass */
    --border-card: rgba(237, 224, 212, 0.08);
    /* Warm cream border */
    --border-card-hover: rgba(101, 109, 74, 0.5);
    /* Sage green hover border */

    --text-primary: #ede0d4;
    /* Warm cream */
    --text-secondary: #dcd1c5;
    /* Soft tan/cream */
    --text-muted: #8e957e;
    /* Muted sage */

    --accent-primary: #656d4a;
    /* Sage green */
    --accent-primary-hover: #4f5539;
    /* Darker sage green */
    --accent-secondary: #A68A64;
    /* Warm golden tan */
    --accent-secondary-hover: #7F5539;
    /* Warm brown */

    --error: #cf5c5c;
    /* Soft red */
    --success: #656d4a;
    /* Sage success */

    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);

    --font-sans: 'Outfit', sans-serif;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(101, 109, 74, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(166, 138, 100, 0.05) 0%, transparent 45%);
  }

  /* App Container */
  .app-container {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }

  /* Header & Navigation */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding: 16px 24px;
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    font-size: 28px;
    color: var(--accent-primary);
    animation: pulse-slow 3s infinite;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  nav {
    display: flex;
    gap: 8px;
  }

  .nav-tab {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-tab:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
  }

  .nav-tab.active {
    background: rgba(101, 109, 74, 0.15);
    color: var(--accent-primary);
    border: 1px solid rgba(101, 109, 74, 0.2);
  }

  /* Main Content Area */
  main {
    flex-grow: 1;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .view {
    display: none;
    animation: fadeIn 0.4s ease-out forwards;
    width: 100%;
  }

  .view.active {
    display: flex;
    flex-direction: column;
  }

  /* Cards & Glass Panel styles */
  .panel {
    background: var(--bg-card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-lg);
    padding: 32px;
    box-shadow: var(--shadow-md);
    margin-bottom: 24px;
    transition: var(--transition);
  }

  .panel-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding-bottom: 12px;
  }

  .panel-title i {
    color: var(--accent-primary);
  }

  /* Inputs & Form Controls */
  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    color: var(--text-secondary);
  }

  .input-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: -4px;
    margin-bottom: 8px;
  }

  input[type="text"],
  textarea {
    width: 100%;
    background: rgba(28, 30, 21, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-family: var(--font-sans);
    color: var(--text-primary);
    font-size: 15px;
    transition: var(--transition);
  }

  input[type="text"]:focus,
  textarea:focus {
    outline: none;
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px rgba(101, 109, 74, 0.2);
    background: rgba(28, 30, 21, 0.8);
  }

  textarea {
    resize: vertical;
    min-height: 90px;
  }

  /* Action Buttons */
  .btn {
    background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-primary-hover) 100%);
    border: none;
    color: #fff;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 12px rgba(101, 109, 74, 0.25);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(101, 109, 74, 0.4);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text-secondary);
    box-shadow: none;
  }

  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
    box-shadow: none;
  }

  .btn-danger {
    background: linear-gradient(135deg, var(--error) 0%, #dc2626 100%);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
  }

  .btn-danger:hover {
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35);
  }

  .btn-gold {
    background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-secondary-hover) 100%);
    box-shadow: 0 4px 12px rgba(166, 138, 100, 0.2);
    color: #fff;
  }

  .btn-gold:hover {
    box-shadow: 0 6px 20px rgba(166, 138, 100, 0.35);
  }

  .btn-disabled {
    background: var(--text-muted);
    cursor: not-allowed;
    opacity: 0.5;
    box-shadow: none;
  }

  .btn-disabled:hover {
    transform: none;
    box-shadow: none;
  }

  /* Loading & Empty State Views */
  .loading-overlay {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 32px;
    text-align: center;
  }

  .loader {
    width: 64px;
    height: 64px;
    border: 5px solid rgba(101, 109, 74, 0.1);
    border-radius: 50%;
    border-top-color: var(--accent-primary);
    animation: spin 1s linear infinite;
    margin-bottom: 24px;
  }

  .loading-text {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .loading-subtext {
    font-size: 14px;
    color: var(--text-muted);
    max-width: 400px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    background: var(--bg-card);
    border: 1px dashed rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-lg);
    margin-bottom: 24px;
  }

  .empty-state-icon {
    font-size: 48px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .empty-state h3 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 24px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Recipe Grid and Cards */
  .meal-plan-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .meal-plan-title {
    font-size: 22px;
    font-weight: 700;
  }

  .meal-plan-metadata {
    font-size: 13px;
    color: var(--text-muted);
  }

  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
    margin-bottom: 32px;
  }

  .recipe-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-md);
    padding: 24px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    transition: var(--transition);
    cursor: pointer;
  }

  .recipe-card:hover {
    transform: translateY(-4px);
    border-color: var(--border-card-hover);
    box-shadow: var(--shadow-md);
  }

  .recipe-card.approved-card {
    border-left: 4px solid var(--accent-primary);
  }

  .recipe-card.deselected-card {
    opacity: 0.45;
    border-left: 4px solid var(--text-muted);
  }

  .recipe-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .recipe-title {
    font-size: 18px;
    font-weight: 600;
    flex-grow: 1;
    padding-right: 12px;
  }

  .recipe-checkbox {
    position: relative;
    width: 24px;
    height: 24px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    background: rgba(28, 30, 21, 0.4);
    flex-shrink: 0;
  }

  .recipe-card.approved-card .recipe-checkbox {
    border-color: var(--accent-primary);
    background: var(--accent-primary);
  }

  .recipe-checkbox::after {
    content: "✓";
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: none;
  }

  .recipe-card.approved-card .recipe-checkbox::after {
    display: block;
  }

  .recipe-desc {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    flex-grow: 1;
  }

  .recipe-meta-row {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    padding-top: 12px;
    margin-bottom: 12px;
  }

  .recipe-meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .recipe-meta-item i {
    color: var(--accent-primary);
  }

  /* Card Scheduler Styles */
  .recipe-date-container {
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: rgba(28, 30, 21, 0.3);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }

  .recipe-date-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .recipe-date-input {
    background: rgba(28, 30, 21, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 4px 8px;
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 12px;
    outline: none;
    transition: var(--transition);
    cursor: pointer;
  }

  .recipe-date-input:focus {
    border-color: var(--accent-primary);
  }

  .recipe-accordion {
    border-top: 1px dashed rgba(255, 255, 255, 0.05);
    padding-top: 12px;
  }

  .recipe-accordion-btn {
    background: none;
    border: none;
    color: var(--accent-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    transition: var(--transition);
  }

  .recipe-accordion-btn:hover {
    color: var(--accent-primary-hover);
  }

  .recipe-details {
    display: none;
    margin-top: 12px;
    animation: slideDown 0.3s ease-out forwards;
  }

  .recipe-details.open {
    display: block;
  }

  .detail-section {
    margin-bottom: 12px;
  }

  .detail-heading {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .detail-list {
    list-style: none;
    font-size: 13px;
  }

  .detail-list li {
    margin-bottom: 4px;
    padding-left: 12px;
    position: relative;
  }

  .detail-list li::before {
    content: "•";
    color: var(--accent-primary);
    position: absolute;
    left: 0;
  }

  /* Success Execution Box */
  .success-box {
    background: rgba(101, 109, 74, 0.08);
    border: 1px solid rgba(101, 109, 74, 0.2);
    border-radius: var(--radius-lg);
    padding: 32px;
    text-align: center;
    margin-bottom: 32px;
    animation: scaleUp 0.4s ease-out forwards;
  }

  .success-icon {
    font-size: 48px;
    color: var(--accent-primary);
    margin-bottom: 16px;
  }

  .success-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .success-desc {
    font-size: 14px;
    color: var(--text-secondary);
    max-width: 600px;
    margin: 0 auto 24px;
  }

  .success-links {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .doc-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
  }

  .doc-link:hover {
    background: rgba(101, 109, 74, 0.15);
    border-color: rgba(101, 109, 74, 0.3);
    transform: translateY(-2px);
  }

  /* Keyframe Animations */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes pulse-slow {

    0%,
    100% {
      opacity: 1;
      transform: scale(1);
    }

    50% {
      opacity: 0.8;
      transform: scale(1.05);
    }
  }

  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes scaleUp {
    from {
      opacity: 0;
      transform: scale(0.95);
    }

    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* API Key Badge */
  .api-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .api-badge.active {
    background: rgba(101, 109, 74, 0.15);
    color: var(--accent-primary);
  }

  .api-badge.missing {
    background: rgba(239, 68, 68, 0.15);
    color: var(--error);
  }

  /* Toast Notifications */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg-secondary);
    border-left: 4px solid var(--accent-primary);
    border-radius: var(--radius-sm);
    padding: 12px 24px;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1000;
    transform: translateY(150%);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .toast.show {
    transform: translateY(0);
  }

  .toast.toast-error {
    border-left-color: var(--error);
  }

  /* Responsive Overrides */
  @media(max-width: 768px) {
    header {
      flex-direction: column;
      gap: 16px;
      align-items: stretch;
      text-align: center;
    }

    .brand {
      justify-content: center;
    }

    nav {
      justify-content: center;
    }

    .recipe-grid {
      grid-template-columns: 1fr;
    }

    .app-container {
      padding: 12px;
    }

    .panel {
      padding: 20px;
    }
  }

  /* History Tab Styles */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: var(--radius-sm);
    transition: var(--transition);
  }

  .history-item:hover {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(101, 109, 74, 0.25);
    transform: translateX(4px);
  }

  .history-item-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .history-item-date {
    font-family: monospace;
    font-size: 13px;
    color: var(--accent-secondary);
    background: rgba(251, 191, 36, 0.1);
    padding: 4px 8px;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .history-item-name {
    font-weight: 500;
    font-size: 15px;
    color: var(--text-primary);
  }

  .history-item .doc-link {
    background: rgba(101, 109, 74, 0.1);
    border-color: rgba(101, 109, 74, 0.2);
    padding: 8px 14px;
    font-size: 12px;
  }

  .history-item .doc-link:hover {
    background: rgba(101, 109, 74, 0.2);
  }

  a:link {
    color: #ede0d4;
    text-decoration: none;
  }

  /* Cuisine Preferences Grid & Controls */
  .cuisine-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(6, auto);
    grid-auto-flow: column;
    gap: 10px 18px;
    margin-top: 8px;
  }

  @media (max-width: 768px) {
    .cuisine-grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      grid-auto-flow: row;
    }
  }

  .cuisine-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(28, 30, 21, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: var(--radius-sm);
    transition: var(--transition);
  }

  .cuisine-card:hover {
    background: rgba(28, 30, 21, 0.7);
    border-color: rgba(255, 255, 255, 0.12);
  }

  .cuisine-card.status-prefer {
    border-color: rgba(101, 109, 74, 0.6);
    background: rgba(101, 109, 74, 0.14);
  }

  .cuisine-card.status-avoid {
    border-color: rgba(207, 92, 92, 0.5);
    background: rgba(207, 92, 92, 0.12);
  }

  .cuisine-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cuisine-icon {
    font-size: 15px;
    flex-shrink: 0;
  }

  .cuisine-toggle-group {
    display: flex;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
    flex-shrink: 0;
  }

  .cuisine-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
    line-height: 1.2;
  }

  .cuisine-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.06);
  }

  .cuisine-btn.active-neutral {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-primary);
  }

  .cuisine-btn.active-prefer {
